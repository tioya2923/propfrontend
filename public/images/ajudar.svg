<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#2d0f0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#991010;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a0a0a;stop-opacity:0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="0.9" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="1400" height="380" fill="url(#bg)"/>
  <rect width="1400" height="380" fill="url(#glow)"/>
  <rect width="1400" height="380" fill="url(#dots)"/>
  <!-- large cross -->
  <g opacity="0.10" fill="#b91010">
    <rect x="690" y="40" width="20" height="100" rx="3"/>
    <rect x="650" y="75" width="100" height="20" rx="3"/>
  </g>
  <!-- heart -->
  <g opacity="0.14" fill="#ffffff">
    <path d="M700 180 Q675 155 650 170 Q625 185 650 215 L700 260 L750 215 Q775 185 750 170 Q725 155 700 180 Z"/>
  </g>
  <!-- radiant lines -->
  <g opacity="0.05" stroke="#d41818" stroke-width="1.5">
    <line x1="700" y1="190" x2="300" y2="60"/>
    <line x1="700" y1="190" x2="1100" y2="60"/>
    <line x1="700" y1="190" x2="100" y2="190"/>
    <line x1="700" y1="190" x2="1300" y2="190"/>
    <line x1="700" y1="190" x2="300" y2="340"/>
    <line x1="700" y1="190" x2="1100" y2="340"/>
  </g>
</svg>
