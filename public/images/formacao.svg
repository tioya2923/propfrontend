<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b1b2e"/>
      <stop offset="100%" style="stop-color:#2c1654"/>
    </linearGradient>
    <pattern id="lines" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="60" y1="0" x2="0" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="380" fill="url(#bg)"/>
  <rect width="1400" height="380" fill="url(#lines)"/>
  <!-- open book centre -->
  <g opacity="0.13" fill="#d41818">
    <path d="M620 60 Q700 40 780 60 L780 300 Q700 280 620 300 Z"/>
    <path d="M620 60 Q540 40 460 60 L460 300 Q540 280 620 300 Z"/>
  </g>
  <line x1="620" y1="60" x2="620" y2="300" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- page lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="480" y1="110" x2="610" y2="105"/>
    <line x1="480" y1="135" x2="610" y2="130"/>
    <line x1="480" y1="160" x2="610" y2="155"/>
    <line x1="480" y1="185" x2="610" y2="180"/>
    <line x1="480" y1="210" x2="610" y2="205"/>
    <line x1="480" y1="235" x2="610" y2="230"/>
    <line x1="635" y1="105" x2="765" y2="110"/>
    <line x1="635" y1="130" x2="765" y2="135"/>
    <line x1="635" y1="155" x2="765" y2="160"/>
    <line x1="635" y1="180" x2="765" y2="185"/>
    <line x1="635" y1="205" x2="765" y2="210"/>
    <line x1="635" y1="230" x2="765" y2="235"/>
  </g>
  <!-- stacked books left -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="150" y="160" width="130" height="22" rx="3"/>
    <rect x="155" y="138" width="120" height="22" rx="3"/>
    <rect x="148" y="116" width="135" height="22" rx="3"/>
    <rect x="160" y="94" width="115" height="22" rx="3"/>
    <rect x="150" y="182" width="130" height="70" rx="0"/>
  </g>
  <!-- stacked books right -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="1100" y="160" width="130" height="22" rx="3"/>
    <rect x="1105" y="138" width="120" height="22" rx="3"/>
    <rect x="1098" y="116" width="135" height="22" rx="3"/>
    <rect x="1110" y="94" width="115" height="22" rx="3"/>
    <rect x="1100" y="182" width="130" height="70" rx="0"/>
  </g>
</svg>
